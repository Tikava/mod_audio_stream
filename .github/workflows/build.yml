name: Build

on:
  push:
    branches: [ main, master, develop, "feature/**" ]
  pull_request:
    branches: [ main, master ]

# Reusable step: add the FreeSWITCH APT repository.
# Ubuntu 22.04 (Jammy) is ABI-compatible with Debian Bookworm for FS packages.
# Ubuntu 24.04 (Noble) needs the 'noble' dist; kept as env var per matrix job.
env:
  FS_REPO_KEY_URL: https://files.freeswitch.org/repo/deb/debian-release/pubkey.gpg
  FS_REPO_LIST: https://files.freeswitch.org/repo/deb/debian-release/

jobs:
  build:
    name: Build on Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: [ "22.04" ]  # 24.04 pending FreeSWITCH noble packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add FreeSWITCH repository
        run: |
          sudo apt-get install -y --no-install-recommends gnupg2 wget
          wget -qO /usr/share/keyrings/freeswitch-archive-keyring.gpg \
            ${{ env.FS_REPO_KEY_URL }}
          echo "deb [signed-by=/usr/share/keyrings/freeswitch-archive-keyring.gpg] \
            ${{ env.FS_REPO_LIST }} bookworm main" | \
            sudo tee /etc/apt/sources.list.d/freeswitch.list
          sudo apt-get update -qq

      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config \
            libfreeswitch-dev \
            libssl-dev \
            zlib1g-dev \
            libevent-dev \
            libspeexdsp-dev

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Verify .so exists
        run: test -f build/mod_audio_stream.so

  lint:
    name: Lint (cppcheck)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add FreeSWITCH repository
        run: |
          sudo apt-get install -y --no-install-recommends gnupg2 wget
          wget -qO /usr/share/keyrings/freeswitch-archive-keyring.gpg \
            ${{ env.FS_REPO_KEY_URL }}
          echo "deb [signed-by=/usr/share/keyrings/freeswitch-archive-keyring.gpg] \
            ${{ env.FS_REPO_LIST }} bookworm main" | \
            sudo tee /etc/apt/sources.list.d/freeswitch.list
          sudo apt-get update -qq

      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            cppcheck libfreeswitch-dev libspeexdsp-dev

      - name: Run cppcheck (C++)
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            -I/usr/include/freeswitch \
            -I/usr/include/speex \
            --language=c++ \
            --std=c++11 \
            audio_streamer_glue.cpp base64.cpp

      - name: Run cppcheck (C)
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            -I/usr/include/freeswitch \
            --language=c \
            --std=c99 \
            mod_audio_stream.c

  test:
    name: Unit tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # tests/ is a standalone CMake project — no FreeSWITCH needed, no submodules

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake

      - name: Configure tests (standalone, no FreeSWITCH)
        run: cmake -B build-test -DCMAKE_BUILD_TYPE=Debug -S tests

      - name: Build tests
        run: cmake --build build-test --parallel

      - name: Run tests
        run: ctest --test-dir build-test --output-on-failure -V

  package:
    name: Build DEB package
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add FreeSWITCH repository
        run: |
          sudo apt-get install -y --no-install-recommends gnupg2 wget
          wget -qO /usr/share/keyrings/freeswitch-archive-keyring.gpg \
            ${{ env.FS_REPO_KEY_URL }}
          echo "deb [signed-by=/usr/share/keyrings/freeswitch-archive-keyring.gpg] \
            ${{ env.FS_REPO_LIST }} bookworm main" | \
            sudo tee /etc/apt/sources.list.d/freeswitch.list
          sudo apt-get update -qq

      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config \
            libfreeswitch-dev libssl-dev zlib1g-dev libevent-dev libspeexdsp-dev

      - name: Configure & Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Package DEB
        working-directory: build
        run: cpack -G DEB

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-audio-stream-deb
          path: _packages/*.deb
          retention-days: 30
