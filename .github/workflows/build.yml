name: Build

on:
  push:
    branches: [ main, master, develop, "feature/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build (Debian Bookworm)
    runs-on: ubuntu-22.04
    container: debian:bookworm

    steps:
      - name: Install git for checkout
        run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt-get install -y --no-install-recommends \
            cmake pkg-config \
            libfreeswitch-dev \
            libssl-dev \
            zlib1g-dev \
            libevent-dev \
            libspeexdsp-dev

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Verify .so exists
        run: test -f build/mod_audio_stream.so

  lint:
    name: Lint (cppcheck)
    runs-on: ubuntu-22.04
    container: debian:bookworm

    steps:
      - name: Install git for checkout
        run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt-get install -y --no-install-recommends \
            cppcheck libfreeswitch-dev libspeexdsp-dev

      - name: Run cppcheck (C++)
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            -I/usr/include/freeswitch \
            -I/usr/include/speex \
            --language=c++ \
            --std=c++11 \
            audio_streamer_glue.cpp base64.cpp

      - name: Run cppcheck (C)
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            -I/usr/include/freeswitch \
            --language=c \
            --std=c99 \
            mod_audio_stream.c

  test:
    name: Unit tests
    runs-on: ubuntu-22.04
    # No container — tests are standalone, no FreeSWITCH needed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake

      - name: Configure tests
        run: cmake -B build-test -DCMAKE_BUILD_TYPE=Debug -S tests

      - name: Build tests
        run: cmake --build build-test --parallel

      - name: Run tests
        run: ctest --test-dir build-test --output-on-failure -V

  package:
    name: Build DEB package
    runs-on: ubuntu-22.04
    container: debian:bookworm
    needs: build

    steps:
      - name: Install git for checkout
        run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt-get install -y --no-install-recommends \
            cmake pkg-config \
            libfreeswitch-dev libssl-dev zlib1g-dev libevent-dev libspeexdsp-dev

      - name: Configure & Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Package DEB
        working-directory: build
        run: cpack -G DEB

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-audio-stream-deb
          path: _packages/*.deb
          retention-days: 30
